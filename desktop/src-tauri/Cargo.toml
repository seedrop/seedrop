[package]
name = "seedrop-desktop"
version = "0.2.0-alpha.5"
description = "Seedrop Desktop — human installer and viewer"
authors = ["Seedrop"]
edition = "2021"

[lib]
name = "seedrop_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
which = "7"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
wait-timeout = "0.2"
libc = "0.2"
