name: desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing desktop-vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  NODE_VERSION: "20.19.4"

jobs:
  qualify:
    name: qualify tagged source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: verify exact tag, version, and clean source
        run: npm run release:preflight -w @seedrop/desktop -- --tag=${RELEASE_TAG}

      - name: install exact dependency graph
        run: npm ci

      - name: dependency audit
        run: npm audit --audit-level=low

      - name: build, typecheck, and test all workspaces
        run: |
          npm run build --workspaces
          for ws in id space cli mcp observer desktop; do npm run typecheck -w "$ws"; done
          npm test --workspaces

      - name: composition and install smoke tests
        run: |
          npm run smoke -w @seedrop/space
          npm run smoke:http -w @seedrop/space
          npm run smoke -w @seedrop/cli
          npm run smoke:install -w @seedrop/cli

  build:
    name: sign, notarize, and prove / ${{ matrix.arch }}
    needs: qualify
    runs-on: ${{ matrix.os }}
    environment: desktop-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SEEDROP_DESKTOP_ARCH: ${{ matrix.arch }}
      SEEDROP_EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      CI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: verify release authority shape
        run: npm run release:preflight -w @seedrop/desktop -- --tag=${RELEASE_TAG} --credentials

      - name: install exact dependency graph
        run: npm ci

      - name: install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: import Developer ID identity into an ephemeral keychain
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${RUNNER_TEMP}/seedrop-signing.keychain-db"
          CERTIFICATE_PATH="${RUNNER_TEMP}/seedrop-developer-id.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -k "${KEYCHAIN_PATH}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | grep -F "${APPLE_SIGNING_IDENTITY}" >/dev/null
          echo "SEEDROP_RELEASE_KEYCHAIN=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

      - name: materialize App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          API_KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          umask 077
          printf '%s' "${APPLE_API_PRIVATE_KEY}" > "${API_KEY_PATH}"
          echo "APPLE_API_KEY_PATH=${API_KEY_PATH}" >> "${GITHUB_ENV}"

      - name: prepare and test sealed architecture runtime
        run: |
          npm audit --prefix desktop/runtime --audit-level=low
          npm run fetch-runtime -w @seedrop/desktop -- --arch=${SEEDROP_DESKTOP_ARCH}
          npm run prepare-runtime -w @seedrop/desktop
          npm run verify-runtime -w @seedrop/desktop
          npm run test:runtime -w @seedrop/desktop
          npm run typecheck -w @seedrop/desktop
          npm test -w @seedrop/desktop
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
          cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: build, sign, notarize, and staple DMG
        env:
          APPLE_CERTIFICATE: ""
          APPLE_CERTIFICATE_PASSWORD: ""
          APPLE_API_PRIVATE_KEY: ""
        run: npm run tauri:build -w @seedrop/desktop -- --bundles dmg

      - name: strict mounted-DMG release gate and evidence
        run: npm run release:dmg:verify -w @seedrop/desktop -- --arch=${SEEDROP_DESKTOP_ARCH} --evidence=release-evidence-${SEEDROP_DESKTOP_ARCH}.json

      - name: attest DMG provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: retain immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: seedrop-desktop-${{ matrix.arch }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/release-evidence-${{ matrix.arch }}.json
          if-no-files-found: error

      - name: destroy ephemeral signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${SEEDROP_RELEASE_KEYCHAIN:-}" ]]; then security delete-keychain "${SEEDROP_RELEASE_KEYCHAIN}" || true; fi
          rm -f "${RUNNER_TEMP}/seedrop-developer-id.p12" "${RUNNER_TEMP}"/AuthKey_*.p8

  draft-release:
    name: assemble human-approved draft
    needs: build
    runs-on: ubuntu-latest
    environment: desktop-publish
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: seedrop-desktop-*
          path: release-assets
          merge-multiple: true

      - name: create checksums
        working-directory: release-assets
        run: shasum -a 256 *.dmg > SHA256SUMS.txt

      - name: create or update draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            gh release create "${RELEASE_TAG}" release-assets/* --verify-tag --draft --prerelease --title "Seedrop Desktop ${RELEASE_TAG#desktop-v}" --notes "Signed, notarized architecture-specific developer preview. Promote only after the clean-account and rollback drills in desktop/RELEASE.md."
          fi
